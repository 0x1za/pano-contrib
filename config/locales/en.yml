      welcome_title: "Help check Lusaka's new addresses"
      welcome_body_html: "Every building in Lusaka now has a short address, like <b>LS33 9XX 17</b>. It was drawn by a computer. Nobody has asked the people who live there whether it fits. That is what this site is for."
      how_building_html: "<b>Zoom in and tap a building</b> to say “this is my address” or “something is wrong”."
      how_district_html: "<b>Tap a district name</b> at city zoom to say whether that is what you call the area."

    about:
      title: "What pano is"
      eyebrow: "About"
      lede: "A short address for every building in Lusaka and Chililabombwe, and a place for the people who live there to say whether it is right."
      address_h: "How an address works"
      address_p_html: "An address has three parts, like a UK postcode followed by a house number:"
      address_district_html: "<b>LS33</b> is the district: LS for Lusaka (CL for Chililabombwe), then a number. Ng'ombe, Kabulonga and Kanyama each have one."
      address_unit_html: "<b>9XX</b> is the unit, a block of about forty buildings inside that district."
      address_number_html: "<b>17</b> is the building inside the unit, numbered along the streets."
      why_h: "Why it needs you"
      why_p: "The districts and their names were drawn from a map of building footprints and the names people use on OpenStreetMap. A computer cannot tell whether the line it drew between Chibolya and Kanyama is where the residents would draw it, or whether a block called LS33 9XX has a name everyone already uses. You can."
      do_h: "What you can do here"
      do_confirm_html: "<b>Say you live here.</b> The addresses are new, so nobody has one yet. Tapping your building says the dot is a real home and sits where you would put it; three people saying so make the address real, and the map can then be printed and painted."
      do_dispute_html: "<b>Report a problem.</b> No building here, two buildings counted as one, the wrong number. A moderator looks at every report."
      do_homes_html: "<b>Describe a shared building.</b> A block of flats or a plot with several houses: how many homes, how they are labelled, and which is yours. Each gets its own address, like LS33 9XX 17/3."
      do_district_html: "<b>Confirm a district.</b> Is this Kabulonga? District names are set with the map itself, so here you only say yes."
      do_note_html: "<b>Leave a delivery note.</b> A gate colour, a landmark, who to ask for. Nothing private."
      review_h: "How it becomes official"
      review_p: "Contributions are pending until enough people agree with them or a moderator accepts them. Accepted ones are gathered into the next cut of the map, and the map records what changed. You never need an account, but one lets you vote from any phone as one person."
      privacy_h: "Privacy"
      privacy_p: "We store a random token in your browser so that one phone is one voice, and nothing else about you unless you sign up. A note is attached to a building, not a person, and notes that name people are moderated."
      licence_h: "Licence"
      licence_p_html: "Contributions are published under <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a> as “pano contributors”. The map itself is open too; the code and the addressing scheme are on GitHub."
      to_map: "To the map"
      source: "Source on GitHub ↗"

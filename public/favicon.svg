<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="pano">
  <title>pano</title>
  <!-- A 3×3 grid of plus-code cells; four of them joined form a unit, the amber dot is a building. -->
  <g fill="#022EAC" fill-opacity="0.12">
    <rect x="3"  y="3"  width="18" height="18" rx="3"/>
    <rect x="23" y="3"  width="18" height="18" rx="3"/>
    <rect x="43" y="3"  width="18" height="18" rx="3"/>
    <rect x="3"  y="23" width="18" height="18" rx="3"/>
    <rect x="43" y="43" width="18" height="18" rx="3"/>
    <rect x="3"  y="43" width="18" height="18" rx="3"/>
  </g>
  <g fill="#022EAC">
    <rect x="23" y="23" width="18" height="18" rx="3"/>
    <rect x="43" y="23" width="18" height="18" rx="3"/>
    <rect x="23" y="43" width="18" height="18" rx="3"/>
    <rect x="23" y="23" width="38" height="18" rx="3"/>
    <rect x="23" y="23" width="18" height="38" rx="3"/>
  </g>
  <circle cx="32" cy="32" r="4.5" fill="#FBA30C"/>
</svg>
